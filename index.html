<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4fbfc">
<title>Serviexpert | Gestión técnica y ventas</title>
<style>
:root{--ink:#183847;--muted:#71858e;--line:#e5eef0;--bg:#f3f9fa;--white:#fff;--teal:#087f91;--teal2:#dff5f7;--blue:#e7f4fb;--green:#e7f8ed;--amber:#fff3df;--purple:#f2eaff;--shadow:0 8px 30px rgba(26,67,81,.06);--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fbfefe;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#0c8091,#56c7ce);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 7px 16px #0b83922b}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px}.navlabel{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#91a3aa;padding:18px 12px 8px}.nav button{width:100%;border:0;background:transparent;color:#49616b;text-align:left;padding:12px 13px;border-radius:13px;margin:2px 0;display:flex;align-items:center;gap:12px;font-weight:650}.nav button .ico{font-size:18px;width:24px;text-align:center}.nav button.active,.nav button:hover{background:#e3f5f6;color:#08798a}.sidebar-foot{position:absolute;bottom:18px;left:18px;right:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px}.main{min-width:0;padding:0 30px 40px}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 -2px 26px}.topbar h1{font-size:25px;letter-spacing:-.8px;margin:0}.top-right{display:flex;align-items:center;gap:12px}.date{color:var(--muted);font-size:12px}.userpill{border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px 13px;font-size:12px}.userpill b{display:block}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}.btn.primary{background:#087f91;color:white;border-color:#087f91}.btn.soft{background:#e9f7f8;color:#08798a;border-color:#d4eff1}.btn.danger{color:#b04c4c}.content{max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;margin:0 0 20px}.eyebrow{color:#0b8796;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800}.welcome h2{font-size:22px;margin:4px 0 3px;letter-spacing:-.6px}.welcome p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;position:relative;overflow:hidden;min-height:120px;box-shadow:var(--shadow)}.stat:after{content:"";position:absolute;width:130px;height:70px;border-radius:60% 0 0 0;right:-15px;bottom:-23px;background:var(--wash)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-weight:650;font-size:12px}.stat-ico{font-size:25px}.stat strong{display:block;font-size:29px;line-height:1.2;margin:7px 0 2px;letter-spacing:-1px}.stat small{color:var(--muted);font-size:11px}.layout2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panelhead h3{margin:0;font-size:17px;letter-spacing:-.3px}.panelhead .lead{display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;background:#4d8fe9;border-radius:50%}.cashbox{background:linear-gradient(115deg,#e8f9fa,#dff6f7);border:1px solid #d4eff0;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center;min-height:175px}.status{display:inline-block;background:#e9f9ed;color:#27844b;border:1px solid #c9efd4;border-radius:20px;padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:.5px}.cashbox .amount{font-size:32px;font-weight:850;letter-spacing:-1px;margin:6px 0}.cashbox p{color:var(--muted);margin:0}.cashicon{font-size:64px;opacity:.9}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick button{border:1px solid var(--line);border-radius:17px;padding:17px 14px;text-align:left;display:flex;align-items:center;gap:12px;color:var(--ink);background:#f5fbfc;min-height:90px}.quick button:nth-child(2){background:#effbf3}.quick button:nth-child(3){background:#f6f2ff}.quick .big{font-size:27px}.quick b{display:block;font-size:13px}.quick small{color:var(--muted);font-size:11px}.quick .arrow{margin-left:auto;color:#5b8e98;font-size:20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#81949b;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eef3f4;font-size:12px}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:750}.tag.blue{background:#e8f3fb;color:#39759a}.tag.amber{background:#fff3df;color:#a66c1c}.tag.green{background:#e7f8ed;color:#28834c}.tag.purple{background:#f2eaff;color:#7653a9}.muted{color:var(--muted)}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pagehead h2{margin:0;font-size:23px}.pagehead p{margin:4px 0 0;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;min-width:220px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#62b8c2;box-shadow:0 0 0 3px #dff5f6}.empty{text-align:center;padding:40px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#617780;font-weight:750}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:80px;resize:vertical}.modalback{position:fixed;inset:0;background:#14343f70;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.show{display:flex}.modal{background:white;border-radius:22px;padding:24px;width:min(650px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 80px #102e3a40}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:19px}.x{border:0;background:#f1f6f7;border-radius:10px;width:34px;height:34px;font-size:20px;color:#59717a}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{background:#fff8e9;border:1px solid #f4e4c5;color:#8a682c;padding:12px 14px;border-radius:13px;font-size:12px;margin-bottom:16px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{background:#f5fafb;border-radius:12px;padding:12px}.detail small{color:var(--muted);display:block;font-size:10px}.detail b{display:block;margin-top:4px}.toast{position:fixed;right:22px;bottom:22px;background:#173d49;color:white;padding:13px 18px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.mobiletop{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}.app{grid-template-columns:215px 1fr}.main{padding:0 20px 30px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.main{padding:0 14px 28px}.mobiletop{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px}.mobiletop .brand{border:0;margin:0;padding:0}.mobiletop button{border:0;background:#e4f5f6;padding:9px 12px;border-radius:10px;color:#08798a}.topbar{height:auto;padding:8px 0 17px;margin-bottom:20px;align-items:flex-start}.topbar h1{font-size:20px}.top-right .date,.userpill{display:none}.stats{gap:10px}.stat{padding:15px;min-height:108px}.stat strong{font-size:25px}.panel{padding:16px}.quick{grid-template-columns:1fr}.quick button{min-height:72px}.welcome{align-items:flex-start;gap:10px;flex-direction:column}.pagehead{align-items:flex-start;gap:12px;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.detailgrid{grid-template-columns:1fr 1fr}.cashicon{font-size:48px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">S</div><div><strong>serviexpert</strong><small>Gestión técnica y ventas</small></div></div>
 <nav class="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span>Inicio</button>
  <button data-page="cash"><span class="ico">▣</span>Caja</button>
  <div class="navlabel">GESTIÓN</div>
  <button data-page="orders"><span class="ico">🛠</span>Órdenes de servicio</button>
  <button data-page="clients"><span class="ico">♙</span>Clientes</button>
  <div class="navlabel">INVENTARIO Y COMERCIAL</div>
  <button data-page="inventory"><span class="ico">▤</span>Inventario</button>
  <button data-page="sales"><span class="ico">🛒</span>Ventas</button>
  <div class="navlabel">SISTEMA</div>
  <button data-page="settings"><span class="ico">⚙</span>Configuración</button>
 </nav>
 <div class="sidebar-foot">Demo interactiva · Datos de ejemplo<br>Serviexpert © 2026</div>
</aside>
<main class="main">
 <div class="mobiletop"><div class="brand"><div class="brandmark">S</div><div><strong>serviexpert</strong><small>Gestión técnica y ventas</small></div></div><button id="mobileMenu">☰ Menú</button></div>
 <header class="topbar"><h1 id="topTitle">Panel principal</h1><div class="top-right"><span class="date" id="today"></span><div class="userpill"><b>serviexpert</b>Administrador</div><button class="btn soft" onclick="navigate('cash')">Ver caja</button><button class="btn danger" onclick="toast('Esta es una demostración. No hay sesión real.')">Cerrar sesión</button></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<div class="modalback" id="modalback"><section class="modal"><div class="modalhead"><h3 id="modalTitle">Nuevo registro</h3><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></section></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const today=new Date();$('#today').textContent=today.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
let clients=[
{id:1,name:'María González',phone:'0412-555-0182',email:'maria@email.com'},
{id:2,name:'Carlos Méndez',phone:'0414-555-0136',email:'carlos@email.com'},
{id:3,name:'José Ramírez',phone:'0424-555-0161',email:'jose@email.com'}
];
let orders=[
{id:'SV-2026-001',client:1,device:'Laptop Lenovo IdeaPad 3',problem:'No enciende',date:'23/11/2026',status:'En diagnóstico',cost:0,notes:'Recibida con cargador. Buen estado físico.'},
{id:'SV-2026-002',client:2,device:'PC de escritorio HP',problem:'Lentitud y sobrecalentamiento',date:'22/11/2026',status:'En reparación',cost:45,notes:'Limpieza interna y revisión térmica.'},
{id:'SV-2026-003',client:3,device:'Laptop HP Pavilion',problem:'Cambio de teclado',date:'20/11/2026',status:'Lista para entregar',cost:80,notes:'Repuesto instalado y probado.'},
{id:'SV-2026-004',client:1,device:'PC ensamblada',problem:'Instalación de sistema operativo',date:'19/11/2026',status:'Entregada',cost:35,notes:'Trabajo completado.'}
];
let inventory=[{name:'SSD 480 GB',sku:'SSD-480',qty:6,price:32},{name:'Memoria RAM DDR4 8 GB',sku:'RAM-8D4',qty:4,price:24},{name:'Cargador universal',sku:'CAR-UNI',qty:3,price:18}];
let sales=[{id:'V-001',desc:'SSD 480 GB',client:'Carlos Méndez',total:32,date:'23/11/2026'},{id:'V-002',desc:'Servicio de mantenimiento',client:'María González',total:25,date:'22/11/2026'}];
let page='home';
const money=n=>'$'+Number(n||0).toFixed(2).replace('.',',');
const clientName=id=>clients.find(c=>c.id===id)?.name||'Cliente eliminado';
const statusClass=s=>s==='Entregada'?'green':s==='Lista para entregar'?'purple':s==='En reparación'?'blue':'amber';
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function navigate(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('#mobileMenu').onclick=()=>toast('En esta demo, usa la navegación de escritorio para cambiar de módulo.');
function home(){let pending=orders.filter(o=>!['Entregada'].includes(o.status)).length,done=orders.filter(o=>o.status==='Entregada').length;
return `<div class="welcome"><div><div class="eyebrow">RESUMEN DEL NEGOCIO</div><h2>¡Buen día! 👋</h2><p>Esto es lo que está pasando hoy en tu taller.</p></div><button class="btn primary" onclick="openOrder()">＋ Registrar equipo</button></div>
<div class="stats">
<div class="stat" style="--wash:#bcecf0"><div class="stat-top">Equipos registrados <span class="stat-ico">💻</span></div><strong>${orders.length}</strong><small>Órdenes en el sistema</small></div>
<div class="stat" style="--wash:#ffe0a1"><div class="stat-top">Pendientes <span class="stat-ico">🔧</span></div><strong>${pending}</strong><small>En proceso o por entregar</small></div>
<div class="stat" style="--wash:#b8f0ce"><div class="stat-top">Reparados <span class="stat-ico">✅</span></div><strong>${orders.filter(o=>['Lista para entregar','Entregada'].includes(o.status)).length}</strong><small>Listos o completados</small></div>
<div class="stat" style="--wash:#dec7ff"><div class="stat-top">Entregados <span class="stat-ico">📦</span></div><strong>${done}</strong><small>Equipos devueltos al cliente</small></div></div>
<div class="layout2"><section class="panel"><div class="panelhead"><div class="lead"><span class="dot"></span><h3>Estado de caja</h3></div><button class="btn" onclick="navigate('cash')">Ver movimientos →</button></div><div class="cashbox"><div><span class="status">● ABIERTA · DEMO</span><div class="muted" style="font-size:11px;font-weight:800;margin-top:13px">TOTAL REGISTRADO</div><div class="amount">${money(sales.reduce((a,s)=>a+Number(s.total),0))}</div><p>Ingresos de ejemplo · No representa dinero real</p></div><div class="cashicon">🧾</div></div></section>
<section class="panel"><div class="panelhead"><div class="lead"><span class="dot"></span><h3>Acciones rápidas</h3></div></div><div class="quick"><button onclick="openOrder()"><span class="big">🛠️</span><span><b>Registrar equipo</b><small>Nueva orden</small></span><span class="arrow">→</span></button><button onclick="openSale()"><span class="big">🛒</span><span><b>Nueva venta</b><small>Registrar producto</small></span><span class="arrow">→</span></button><button onclick="openClient()"><span class="big">👥</span><span><b>Nuevo cliente</b><small>Registrar persona</small></span><span class="arrow">→</span></button></div></section></div>
<section class="panel"><div class="panelhead"><div class="lead"><span class="dot"></span><h3>Órdenes de servicio recientes</h3></div><button class="btn" onclick="navigate('orders')">Ver todas →</button></div>${ordersTable(orders.slice(0,5))}</section>`;
}
function ordersTable(list){return `<div class="tablewrap"><table><thead><tr><th>N.º orden</th><th>Cliente</th><th>Equipo</th><th>Fecha</th><th>Estado</th><th>Importe</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.id}</b></td><td>${clientName(o.client)}</td><td>${o.device}</td><td>${o.date}</td><td><span class="tag ${statusClass(o.status)}">${o.status}</span></td><td>${money(o.cost)}</td><td><button class="btn" onclick="viewOrder('${o.id}')">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay órdenes registradas.</td></tr>'}</tbody></table></div>`}
function clientsTable(list){return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Correo</th><th>Equipos</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.email||'—'}</td><td>${orders.filter(o=>o.client===c.id).length}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No hay clientes.</td></tr>'}</tbody></table></div>`}
function ordersPage(){return `<div class="pagehead"><div><h2>Órdenes de servicio</h2><p>Controla cada equipo desde su recepción hasta la entrega.</p></div><button class="btn primary" onclick="openOrder()">＋ Nueva orden</button></div><div class="panel"><div class="toolbar"><input class="search" id="orderSearch" placeholder="Buscar por orden, cliente o equipo…" oninput="filterOrders()"><select class="search" id="statusFilter" onchange="filterOrders()"><option value="">Todos los estados</option>${['Recibido','En diagnóstico','En reparación','Lista para entregar','Entregada'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="ordersTable">${ordersTable(orders)}</div></div>`}
function filterOrders(){let q=$('#orderSearch').value.toLowerCase(),s=$('#statusFilter').value;let arr=orders.filter(o=>(o.id+' '+clientName(o.client)+' '+o.device).toLowerCase().includes(q)&&(!s||o.status===s));$('#ordersTable').innerHTML=ordersTable(arr)}
function clientsPage(){return `<div class="pagehead"><div><h2>Clientes</h2><p>Directorio e historial de atención.</p></div><button class="btn primary" onclick="openClient()">＋ Nuevo cliente</button></div><div class="panel"><div class="toolbar"><input class="search" id="clientSearch" placeholder="Buscar cliente…" oninput="filterClients()"></div><div id="clientsTable">${clientsTable(clients)}</div></div>`}
function filterClients(){let q=$('#clientSearch').value.toLowerCase();$('#clientsTable').innerHTML=clientsTable(clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)))}
function cashPage(){return `<div class="pagehead"><div><h2>Caja</h2><p>Resumen de ingresos registrados en la demostración.</p></div><button class="btn primary" onclick="openSale()">＋ Registrar ingreso</button></div><div class="notice">Modo demostración: los importes son ficticios. No se realizan cobros ni transacciones reales.</div><div class="stats"><div class="stat" style="--wash:#bcecf0"><div class="stat-top">Ingresos registrados</div><strong>${money(sales.reduce((a,s)=>a+Number(s.total),0))}</strong><small>Ventas de ejemplo</small></div><div class="stat" style="--wash:#b8f0ce"><div class="stat-top">Movimientos</div><strong>${sales.length}</strong><small>Registros en caja</small></div></div><div class="panel"><div class="panelhead"><h3>Movimientos recientes</h3></div><div class="tablewrap"><table><thead><tr><th>Referencia</th><th>Concepto</th><th>Cliente</th><th>Fecha</th><th>Importe</th></tr></thead><tbody>${sales.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.desc}</td><td>${s.client}</td><td>${s.date}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div></div>`}
function inventoryPage(){return `<div class="pagehead"><div><h2>Inventario</h2><p>Control básico de repuestos y productos.</p></div><button class="btn primary" onclick="openProduct()">＋ Agregar producto</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Producto</th><th>SKU</th><th>Existencia</th><th>Precio de referencia</th><th>Disponibilidad</th></tr></thead><tbody>${inventory.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.sku}</td><td>${p.qty}</td><td>${money(p.price)}</td><td><span class="tag ${p.qty<4?'amber':'green'}">${p.qty<4?'Stock bajo':'Disponible'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function salesPage(){return `<div class="pagehead"><div><h2>Ventas</h2><p>Registro de productos y servicios vendidos.</p></div><button class="btn primary" onclick="openSale()">＋ Nueva venta</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Referencia</th><th>Concepto</th><th>Cliente</th><th>Fecha</th><th>Total</th></tr></thead><tbody>${sales.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.desc}</td><td>${s.client}</td><td>${s.date}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div></div>`}
function settingsPage(){return `<div class="pagehead"><div><h2>Configuración</h2><p>Información general del negocio.</p></div></div><div class="panel"><div class="notice">Esta sección es ilustrativa. La configuración real se conectará al sistema y a la base de datos del negocio.</div><div class="formgrid"><div class="field"><label>Nombre comercial</label><input value="Serviexpert"></div><div class="field"><label>Teléfono</label><input placeholder="Teléfono del negocio"></div><div class="field"><label>Correo</label><input placeholder="correo@negocio.com"></div><div class="field"><label>Dirección</label><input placeholder="Dirección del taller"></div></div><p style="margin-top:18px"><button class="btn primary" onclick="toast('Configuración de muestra; no se guarda en servidor.')">Guardar cambios</button></p></div>`}
function render(){let titles={home:'Panel principal',orders:'Órdenes de servicio',clients:'Clientes',cash:'Caja',inventory:'Inventario',sales:'Ventas',settings:'Configuración'};$('#topTitle').textContent=titles[page]||'Serviexpert';let views={home,orders:ordersPage,clients:clientsPage,cash:cashPage,inventory:inventoryPage,sales:salesPage,settings:settingsPage};$('#view').innerHTML=views[page]()}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
function dateStr(){return new Date().toLocaleDateString('es-ES')}
function openClient(){openModal('Registrar cliente',`<form id="clientForm"><div class="formgrid"><div class="field full"><label>Nombre y apellido *</label><input name="name" required placeholder="Nombre del cliente"></div><div class="field"><label>Teléfono *</label><input name="phone" required placeholder="0412-000-0000"></div><div class="field"><label>Correo electrónico</label><input name="email" type="email" placeholder="cliente@correo.com"></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar cliente</button></div></form>`);$('#clientForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));clients.push({...d,id:Math.max(0,...clients.map(c=>c.id))+1});closeModal();render();toast('Cliente registrado en esta demo.')}}
function openOrder(){let opts=clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');openModal('Recepción de equipo',`<form id="orderForm"><div class="formgrid"><div class="field"><label>Cliente *</label><select name="client" required>${opts}</select></div><div class="field"><label>Fecha de recepción</label><input name="date" value="${dateStr()}" required></div><div class="field full"><label>Equipo / marca y modelo *</label><input name="device" required placeholder="Ej. Laptop Dell Inspiron 15"></div><div class="field full"><label>Falla reportada *</label><input name="problem" required placeholder="Describe brevemente el problema"></div><div class="field"><label>Estado inicial</label><select name="status"><option>Recibido</option><option>En diagnóstico</option><option>En reparación</option></select></div><div class="field"><label>Coste estimado ($)</label><input name="cost" type="number" min="0" step=".01" value="0"></div><div class="field full"><label>Condición física / accesorios / observaciones</label><textarea name="notes" placeholder="Cargador, golpes visibles, accesorios recibidos…"></textarea></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Crear orden de servicio</button></div></form>`);$('#orderForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let id='SV-2026-'+String(orders.length+1).padStart(3,'0');orders.unshift({...d,id,client:Number(d.client),cost:Number(d.cost),date:d.date});closeModal();navigate('orders');toast('Orden '+id+' creada.')}}
function openSale(){let opts=clients.map(c=>`<option>${c.name}</option>`).join('');openModal('Registrar venta / ingreso',`<form id="saleForm"><div class="formgrid"><div class="field full"><label>Concepto *</label><input name="desc" required placeholder="Producto o servicio"></div><div class="field"><label>Cliente</label><select name="client"><option>Venta directa</option>${opts}</select></div><div class="field"><label>Importe ($) *</label><input name="total" type="number" min="0.01" step=".01" required></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Registrar ingreso</button></div></form>`);$('#saleForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));sales.unshift({...d,id:'V-'+String(sales.length+1).padStart(3,'0'),total:Number(d.total),date:dateStr()});closeModal();render();toast('Ingreso registrado en la demo.')}}
function openProduct(){openModal('Agregar producto',`<form id="productForm"><div class="formgrid"><div class="field full"><label>Nombre del producto *</label><input name="name" required></div><div class="field"><label>SKU / Código</label><input name="sku"></div><div class="field"><label>Existencia</label><input name="qty" type="number" min="0" value="1"></div><div class="field"><label>Precio de referencia ($)</label><input name="price" type="number" min="0" step=".01" value="0"></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar producto</button></div></form>`);$('#productForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));inventory.push({...d,qty:Number(d.qty),price:Number(d.price)});closeModal();render();toast('Producto agregado a la demo.')}}
function viewOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;openModal('Orden '+o.id,`<div class="detailgrid"><div class="detail"><small>Cliente</small><b>${clientName(o.client)}</b></div><div class="detail"><small>Fecha</small><b>${o.date}</b></div><div class="detail"><small>Importe estimado</small><b>${money(o.cost)}</b></div></div><div style="margin:16px 0"><b>${o.device}</b><p class="muted" style="margin:5px 0">Falla reportada: ${o.problem}</p><p class="muted" style="margin:5px 0">Observaciones: ${o.notes||'Sin observaciones'}</p></div><div class="field"><label>Actualizar estado</label><select id="updateStatus">${['Recibido','En diagnóstico','En reparación','Lista para entregar','Entregada'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="updateOrder('${o.id}')">Guardar estado</button></div>`)}
function updateOrder(id){let o=orders.find(x=>x.id===id);o.status=$('#updateStatus').value;closeModal();render();toast('Estado de la orden actualizado.')}
render();
</script>
</body></html>
